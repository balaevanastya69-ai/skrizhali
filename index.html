<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Апдейт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#eb6941;--text:#1A1A1A;--bg:#ffffff}
html,body{height:100%;background:var(--bg);font-family:'Montserrat',sans-serif;font-weight:300;color:var(--text);overflow:hidden}
body{display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)) 20px}
.wrap{width:100%;max-width:600px;height:100%;display:flex;flex-direction:column;position:relative}
.bar{height:4px;background:#f0f0f0;border-radius:9px;overflow:hidden;flex-shrink:0;margin-bottom:16px}
.barFill{height:100%;width:0%;background:var(--accent);border-radius:9px;transition:width .5s}
.view{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .45s,transform .45s}
.scr.on{opacity:1;transform:none;pointer-events:auto}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 2px 24px 2px}
.body p{font-size:20px;line-height:1.65;margin-bottom:16px}
.body ul{padding-left:24px;margin-bottom:16px}
.body li{font-size:20px;line-height:1.6;margin-bottom:8px;font-style:italic;color:#444}
.foot{flex-shrink:0;padding:12px 0 4px 0}
.btn{display:block;width:100%;border:none;background:var(--accent);color:#fff;font-family:'Montserrat',sans-serif;font-weight:500;font-size:18px;padding:18px 0;border-radius:10px;cursor:pointer;box-shadow:0 0 24px rgba(235,105,65,.28);transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97);box-shadow:0 0 16px rgba(235,105,65,.35)}
.blob1,.blob2{position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
.blob1{width:260px;height:260px;background:radial-gradient(circle,rgba(235,105,65,.06) 0%,transparent 70%);top:-60px;right:-80px}
.blob2{width:300px;height:300px;background:radial-gradient(circle,rgba(235,105,65,.05) 0%,transparent 70%);bottom:-80px;left:-100px}
@media(max-width:480px){
body{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)) 16px}
.body p,.body li{font-size:18px}
.btn{font-size:17px;padding:16px 0}
}
@media(min-width:700px){
.body p,.body li{font-size:22px}
}
</style>
</head>
<body>
<div class="blob1"></div>
<div class="blob2"></div>
<div class="wrap">
<div class="bar"><div class="barFill" id="bf"></div></div>
<div class="view" id="vw"></div>
</div>
<script>
const slides=[
{text:`<p>Мы принимаем от сотен до тысяч решений каждый день!</p><p>Но не всегда осознаем, как они формируют нас и наших близких.</p>`,btn:"Дальше →"},
{text:`<p>Сейчас будет 3 этапа обсуждения.</p><p>Они помогут заново обнаружить то, что у вас итак уже есть.</p><p>Проходите вместе: своей парой / семьей / друзьями.</p><p>Нажимайте «начать», когда будете готовы!</p>`,btn:"Начать"},
{text:`<p>Восстановим кусочек вашего дня!</p><p>Посмотрите друг на друга.</p><p>Вспомните каждый минимум 5 конкретных моментов за сегодня, когда человек, с которым вы сейчас это проходите, сделал для вас что-то маленькое, но реальное.</p><p>Любые действия, которые вам помогали сегодня, даже самые мелочи.</p><p>Например:</p><ul><li>«когда мы шли там-то, ты озвучил мою мысль…»</li><li>«ты посмеялась, когда я…»</li><li>«ты занял место в очереди, пока я…»</li></ul><p>Чем больше, тем лучше!</p><p>Поделитесь ими друг с другом по очереди.</p>`,btn:"Дальше →"},
{text:`<p>Теперь поделитесь по очереди как эти моменты повлияли на вас.</p><p>Не оценивайте «хорошо / плохо / приятно / итд».</p><p>Просто опишите, что с вами происходило. Например:</p><ul><li>«ты выбрала шатер, и мне не пришлось думать куда идти дальше»</li><li>«меня подождали, и я почувствовал что мы движемся в одном темпе»</li><li>«ты прошел со мной ту активность — я чувствовала, что не одна»</li></ul>`,btn:"Дальше →"},
{text:`<p>Посмотрите на все эти моменты еще раз.</p><p>Вряд ли это случайности!</p><p>Вы уже делаете похожие вещи друг для друга в разных ситуациях.</p><p>Вспомните подобные моменты в другие дни, других контекстах.</p><p>Обсудите между собой, какие тенденции проявляются в себе и друг друге.</p>`,btn:"Дальше →"},
{text:`<p>Надеемся, небольшой апдейт произошел!</p><p>Подобные мелкие привычки незаметно создают нашу реальность.</p><p>(А иногда и реальность другого!)</p><p>(И сколько еще таких привычек!)</p><p>Подходите к нам для финальной части апдейта!</p>`,btn:null}
];
const vw=document.getElementById('vw');
const bf=document.getElementById('bf');
let cur=0;
function render(){
vw.innerHTML='';
slides.forEach((s,i)=>{
const d=document.createElement('div');
d.className='scr'+(i===cur?' on':'');
let h='<div class="body">'+s.text+'</div>';
if(s.btn){h+='<div class="foot"><button class="btn">'+s.btn+'</button></div>';}
d.innerHTML=h;
vw.appendChild(d);
});
bf.style.width=(cur/(slides.length-1)*100)+'%';
document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
if(cur<slides.length-1){cur++;render();try{navigator.vibrate(12)}catch(e){}}
});
}
render();
</script>
</body>
</html>
